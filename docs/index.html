<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pandoc-minted example</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        box-sizing: border-box;
        width: min(100%, 72rem);
        margin: 0 auto;
        padding: 1.5rem;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }

      h1,
      p {
        margin: 0;
      }

      header div {
        display: grid;
        gap: 0.5rem;
      }

      nav {
        display: flex;
        gap: 1rem;
      }

      object {
        width: 100%;
        height: calc(100vh - 8.5rem);
        min-height: 32rem;
        border: 1px solid currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>pandoc-minted</h1>
          <p>
            A Pandoc filter for typesetting inline and block code with minted.
          </p>
        </div>
        <nav aria-label="Project links">
          <a href="example.pdf">Example PDF</a>
          <a href="https://github.com/megabyde/pandoc-minted">Source</a>
        </nav>
      </header>
      <object
        data="example.pdf"
        type="application/pdf"
        aria-label="Rendered pandoc-minted example"
      >
        <p>
          This browser cannot display the PDF.
          <a href="example.pdf">Open the example PDF</a>.
        </p>
      </object>
    </main>
  </body>
</html>
