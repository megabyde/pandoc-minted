name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Check linting and formatting
        run: make check

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode:
          - latex
          - beamer
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-latex-extra

      - name: Build PDF
        run: make all MODE=${{ matrix.mode }}

      - name: Stage GitHub Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.mode == 'latex'
        run: |
          mkdir _site
          cp docs/index.html example.pdf _site/

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.mode == 'latex'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
